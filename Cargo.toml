[package]
name = "virus-hunter"
version = "1.0.0"
edition = "2021"
build = "src-tauri/build.rs"

[[bin]]
name = "virus-hunter"
path = "src-tauri/src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.0", features = [] }

[features]
# this feature is used for production builds or when `devDependencies` is not specified, do NOT change it
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

