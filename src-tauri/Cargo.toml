[package]
name = "virus-hunter"
version = "1.0.0"
description = "Fight viruses inside a computer - An action-packed 2.5D game"
edition = "2021"
rust-version = "1.57"
authors = ["Your Name"]
license = "MIT"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["shell-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
